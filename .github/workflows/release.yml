name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon -Pmod_version="${GITHUB_REF_NAME#v}"
      - name: Publish the jar as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="build/libs/ordersmp-clips-${GITHUB_REF_NAME#v}.jar"
          test -f "$jar"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$jar" --title "OrderSMP Clips ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
